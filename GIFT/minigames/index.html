<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GIFT FARM - Мини-игры</title>
  <link rel="stylesheet" href="https://giftfarm.github.io/GIFT/_next/static/css/714c035037a42c97.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    .minigames-container {
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    .minigame-card {
      background-color: #1f2937;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .minigame-card:hover {
      transform: translateY(-3px);
    }
    .minigame-icon {
      width: 50px;
      height: 50px;
      background-color: #374151;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 15px;
      font-size: 24px;
    }
    .minigame-info {
      flex: 1;
    }
    .minigame-title {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 5px;
    }
    .minigame-description {
      font-size: 14px;
      color: #9ca3af;
    }
    .back-button {
      display: inline-block;
      background-color: #4b5563;
      color: white;
      padding: 10px 15px;
      border-radius: 5px;
      margin-bottom: 20px;
      text-decoration: none;
      font-weight: bold;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
    }
  </style>
</head>
<body class="bg-gray-900 text-white">
  <div class="minigames-container">
    <div class="header">
      <a href="../game/" class="back-button">← Назад</a>
      <h1>Мини-игры</h1>
    </div>
    
    <div class="minigame-card" onclick="alert('Мини-игра 1 скоро будет доступна!')">
      <div class="minigame-icon">🎮</div>
      <div class="minigame-info">
        <div class="minigame-title">Кликер GIFT</div>
        <div class="minigame-description">Кликай и собирай монеты GIFT</div>
      </div>
    </div>
    
    <div class="minigame-card" onclick="alert('Мини-игра 2 скоро будет доступна!')">
      <div class="minigame-icon">🎯</div>
      <div class="minigame-info">
        <div class="minigame-title">GIFT Пазл</div>
        <div class="minigame-description">Собери пазл и получи бонусные монеты</div>
      </div>
    </div>
    
    <div class="minigame-card" onclick="alert('Мини-игра 3 скоро будет доступна!')">
      <div class="minigame-icon">🎲</div>
      <div class="minigame-info">
        <div class="minigame-title">GIFT Лотерея</div>
        <div class="minigame-description">Испытай удачу и выиграй монеты</div>
      </div>
    </div>
  </div>
  
  <script>
    // Инициализация Telegram Web App
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
