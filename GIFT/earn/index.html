<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GIFT FARM - Тестовая страница</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #111827);
      color: var(--tg-theme-text-color, #ffffff);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .card {
      background-color: var(--tg-theme-secondary-bg-color, #1f2937);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .button {
      background-color: var(--tg-theme-button-color, #3b82f6);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    .info {
      font-size: 14px;
      margin-top: 5px;
      color: var(--tg-theme-hint-color, #9ca3af);
    }
    .nft-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 20px;
    }
    .nft-item {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }
    .nft-image {
      width: 100%;
      height: 120px;
      background-color: #374151;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .nft-name {
      font-weight: bold;
      margin-bottom: 5px;
    }
    .balance-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      padding: 15px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
    }
    .balance-label {
      font-weight: bold;
    }
    .balance-value {
      font-size: 20px;
      font-weight: bold;
      color: #10b981;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">GIFT FARM</div>
      <div class="info">Фарми NFT, получай GIFT</div>
    </div>
    
    <div class="card">
      <div class="card-title">Твой кошелёк</div>
      <p>Подключи свой TON кошелёк, чтобы начать фармить GIFT токены.</p>
      <button class="button" id="connect-wallet">Подключить кошелёк</button>
    </div>
    
    <div class="card">
      <div class="card-title">Твои NFT</div>
      <p>Найдено NFT: <span id="nft-count">4</span></p>
      
      <div class="nft-grid">
        <div class="nft-item">
          <div class="nft-image">🎁</div>
          <div class="nft-name">GIFT #1</div>
          <button class="button">Начать фарм</button>
        </div>
        <div class="nft-item">
          <div class="nft-image">🎁</div>
          <div class="nft-name">GIFT #2</div>
          <button class="button">Начать фарм</button>
        </div>
        <div class="nft-item">
          <div class="nft-image">🎁</div>
          <div class="nft-name">GIFT #3</div>
          <button class="button">Начать фарм</button>
        </div>
        <div class="nft-item">
          <div class="nft-image">🎁</div>
          <div class="nft-name">GIFT #4</div>
          <button class="button">Начать фарм</button>
        </div>
      </div>
    </div>
    
    <div class="balance-container">
      <div class="balance-label">Баланс GIFT:</div>
      <div class="balance-value" id="gift-balance">0.000</div>
    </div>
    
    <div class="card">
      <div class="card-title">Премиум подписка</div>
      <p>Получи x1.5 к скорости фарма и возможность управлять всеми NFT одной кнопкой!</p>
      <button class="button">Купить подписку</button>
    </div>
  </div>
  
  <script>
    // Инициализация Telegram Web App
    window.addEventListener('DOMContentLoaded', () => {
      // Проверяем, что Telegram Web App доступен
      if (window.Telegram && window.Telegram.WebApp) {
        console.log('Telegram WebApp инициализирован');
        
        // Расширяем приложение на весь экран
        window.Telegram.WebApp.expand();
        
        // Устанавливаем цвет основной кнопки
        window.Telegram.WebApp.MainButton.setParams({
          text: 'СОБРАТЬ МОНЕТЫ',
          color: '#10b981',
          text_color: '#ffffff',
          is_visible: true
        });
        
        // Обработчик нажатия на основную кнопку
        window.Telegram.WebApp.MainButton.onClick(() => {
          const balanceEl = document.getElementById('gift-balance');
          balanceEl.textContent = '10.000';
          
          // Показываем уведомление
          window.Telegram.WebApp.showPopup({
            title: 'Монеты собраны!',
            message: 'Вы успешно собрали 10 GIFT монет.',
            buttons: [{type: 'ok'}]
          });
        });
        
        // Обновляем баланс каждые 2 секунды
        let balance = 0.000;
        const balanceEl = document.getElementById('gift-balance');
        
        setInterval(() => {
          balance += 0.001;
          balanceEl.textContent = balance.toFixed(3);
        }, 2000);
        
        // Обработчик кнопки подключения кошелька
        document.getElementById('connect-wallet').addEventListener('click', () => {
          window.Telegram.WebApp.showPopup({
            title: 'Кошелёк подключен!',
            message: 'Вы успешно подключили TON кошелёк.',
            buttons: [{type: 'ok'}]
          });
        });
      } else {
        console.error('Telegram WebApp не инициализирован');
        document.body.innerHTML = '<div style="padding: 20px; text-align: center;"><h1>Ошибка</h1><p>Это приложение должно быть открыто через Telegram.</p></div>';
      }
    });
  </script>
</body>
</html>
